<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة التدريب المركزي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: plain white page, pastel accents only (cards, chips, tags), one column. Single light theme by choice. */
:root{
  --page:#ffffff; --bg:#f8f7fc; --card:#ffffff; --ink:#2f2b47; --muted:#7a7593; --line:#ece9f6;
  --lav:#ece7fd; --blue:#e1effc; --peach:#ffe8de; --mint:#dff5ef; --butter:#fff4cc; --pink:#fde6ef;
  --accent:#6a5cc4; --sun:#ffe7a3; --sun-ink:#664a00; --sun-edge:#f2d27c;
  --teal:#2f9e8f; --teal-soft:#dcf4ee; --coral:#df7563; --coral-soft:#ffe5dd;
  --good:#2f9e66; --good-soft:#e2f6eb; --warn:#c58a14; --warn-soft:#fff3d1; --bad:#d25a5a; --bad-soft:#fde7e7;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:20px; color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}

/* header: plain white with a hairline */
.hero{background:var(--page);color:var(--ink);border-bottom:1px solid var(--line)}
.hero .inner{padding-block:18px 26px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-size:22px;font-weight:800;transform:rotate(-6deg)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.nav button[aria-current="true"]{background:var(--accent);color:#fff}
.who{font-size:14px;color:var(--muted);font-weight:700}

main{padding-block:8px 56px}
.stack{display:grid;gap:20px}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-edge);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:15px}
input[type=text],input[type=password],select,textarea{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:1.2em}

/* login */
.login{max-width:460px;margin:0 auto;width:100%}
.cgroups{display:grid;gap:12px}
.cgroup{display:grid;gap:6px}
.cg-h{font-size:14px;font-weight:700;color:var(--muted)}
.crow{display:grid;gap:8px}
.crow.b{grid-template-columns:repeat(2,1fr)} .crow.g{grid-template-columns:repeat(3,1fr)}
.cls{border:2px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:700;font-size:18px;font-family:var(--display);text-align:center;font-variant-numeric:tabular-nums}
.cls[data-g="b"]{background:var(--blue)} .cls[data-g="g"]{background:var(--pink)}
.cls[aria-pressed="true"]{border-color:var(--accent);background:var(--lav);color:var(--accent);box-shadow:0 0 0 2px var(--lav)}

/* info */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.info{border-radius:16px;padding:16px;display:grid;gap:6px;align-content:start}
.info h3{font-size:19px}
.info p{margin:0;font-size:16px}
.i1{background:var(--mint)} .i2{background:var(--peach)} .i3{background:var(--butter)} .i4{background:var(--lav)}
.tag{display:inline-block;font-weight:800;font-family:var(--display);font-size:13px;padding:2px 10px;border-radius:999px;background:var(--card)}

/* picker */
.steps{display:grid;gap:16px}
.step-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.step-h .n{width:30px;height:30px;border-radius:50%;background:var(--lav);color:var(--accent);display:grid;place-items:center;font-size:15px;flex:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:2.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;justify-content:center}
.chip .g{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.chip[data-s="lughati"] .g{background:var(--teal-soft);color:var(--teal)}
.chip[data-s="math"] .g{background:var(--coral-soft);color:var(--coral)}
.chip[aria-pressed="true"]{border-color:var(--cur,var(--accent));background:var(--cur-soft,var(--lav))}
.chip:disabled{opacity:.45;cursor:not-allowed}

/* 4 tools */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tool{border:2.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px;display:grid;gap:4px;justify-items:center;font-weight:700;font-size:15px;text-align:center}
.tool .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;background:var(--bg);color:var(--cur)}
.tool[aria-pressed="true"]{border-color:var(--cur);background:var(--cur-soft);color:var(--ink)}
.tool[aria-pressed="true"] .ic{background:var(--card);color:var(--cur)}
.panel{border-top:4px solid var(--cur)}

.explain{display:grid;gap:14px}
.explain .rule{background:var(--bg);border-radius:14px;padding:14px 16px}
.explain .rule h4{margin:0 0 4px;font-family:var(--display);font-size:18px;color:var(--cur)}
.explain .rule p{margin:0}
.ex{margin-top:8px;font-weight:700;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:8px 12px}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cur);border-radius:99px;transition:width .3s}
.q{font-size:clamp(20px,4.8vw,25px);font-weight:700;line-height:1.7;min-width:0}
.big{font-family:var(--display);font-size:1.2em;direction:ltr;unicode-bidi:isolate;display:inline-block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-weight:700;font-size:19px;min-height:58px}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:26px;font-weight:700}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.result{text-align:center;display:grid;gap:8px;justify-items:center}
.result .num{font-family:var(--display);font-size:64px;font-weight:800;color:var(--cur);line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* bank */
.bank{display:grid;gap:12px}
.bq{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.bq .qn{font-weight:700}
.bq .o{display:flex;flex-wrap:wrap;gap:6px}
.bq .o button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 14px;font-weight:700}
.bq .o button.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.bq .o button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.sticky-bank{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--lav);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}

/* survey */
.sq{display:grid;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;font-weight:700;font-size:14px;display:grid;justify-items:center;gap:2px}
.scale button b{font-family:var(--display);font-size:20px}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--lav);color:var(--accent)}
.scale3{grid-template-columns:repeat(3,1fr)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:14px;color:var(--muted);font-weight:700}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 6px;font-weight:700;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--lav);color:var(--accent)}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(90px,30%) 1fr 52px;gap:10px;align-items:center}
.brow .lbl{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.brow .lbl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.track{height:16px;background:var(--bg);border-radius:99px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:99px}
.track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5}
.brow .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:left;font-family:var(--display)}
.lv-good{background:#7fd1a5} .lv-mid{background:#f5cf6e} .lv-bad{background:#f19a9a}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:700}
.p-good{background:var(--good-soft);color:var(--good)} .p-mid{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.sw li{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.sw li b{font-variant-numeric:tabular-nums;font-family:var(--display)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:13px}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}
.delbtn{border:1.5px solid var(--bad-soft);background:var(--card);color:var(--bad);border-radius:10px;padding:4px 10px;font-weight:700;font-size:13px}
.delbtn:hover{background:var(--bad-soft)}
.confirm{background:var(--bad-soft);border-radius:16px;padding:14px;display:grid;gap:10px}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.passage{background:var(--butter);border-radius:16px;padding:16px 18px;display:grid;gap:6px}
.passage h3{font-size:22px;color:var(--accent)}
.passage p{margin:0;font-size:19px;line-height:2;max-width:65ch}
.sugg{display:grid;gap:8px}
.sugg div{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.sugg small{color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15px}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}

.school{display:grid;gap:2px;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.sname{font-family:"Tajawal",system-ui,sans-serif;font-weight:700;font-size:clamp(22px,5.6vw,30px);line-height:1.35;color:var(--ink)}
.sprin{font-size:16px;font-weight:700;color:var(--muted)}
.site-foot{border-top:1px solid var(--line);padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:14px;background:var(--page)}
.site-foot b{color:var(--ink)}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.on{background:var(--good-soft);color:var(--good)} .net.on::before{background:var(--good)}
.net.off{background:var(--warn-soft);color:var(--warn)} .net.off::before{background:var(--warn)}
.journey{background:linear-gradient(135deg,var(--mint),var(--blue));border:0}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jgrid .tile{background:rgba(255,255,255,.75);border:0}
.saved{font-size:13px;font-weight:700;color:var(--good)}
@media (max-width:640px){
  .tools{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .jgrid .tile{padding:10px}.jgrid .tile b{font-size:24px}.jgrid .tile span{font-size:12px}
  .filters{grid-template-columns:1fr}
  .sw{grid-template-columns:1fr}
}
@media (max-width:420px){.opts{grid-template-columns:1fr}.scale button span{font-size:12px}}
@media (prefers-reduced-motion:reduce){.balloon{animation:none!important}.bar i{transition:none}}
</style>

<script>

<script>
/* ================= helpers ================= */
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function numQ(text,ans,spread){const s=new Set([ans]);let g=0;while(s.size<4&&g++<80){const d=ans+R(-spread,spread);if(d>=0&&d!==ans)s.add(d)}let k=1;while(s.size<4)s.add(ans+Math.max(spread,1)*k++);return{q:text,a:ar(ans),o:shuffle([...s]).map(ar)}}
const big=x=>`<span class="big">${x}</span>`;
const lvl=p=>p>=80?'good':p>=60?'mid':'bad';
const lvlName=p=>p>=80?'قوة':p>=60?'متوسط':'ضعف';

const CLASSES=[['ثالث/1 بنين','b'],['ثالث/2 بنين','b'],['ثالث/1 بنات','g'],['ثالث/2 بنات','g'],['ثالث/3 بنات','g']];
const clsLabel=c=>{const [n,g]=c.split(' ');return n.replace('ثالث/','ثالث/')};

/* ================= math generators ================= */
const M={
 place:()=>{const n=R(1000,9999),p=R(0,3),names=['الآحاد','العشرات','المئات','الآلاف'],d=+String(n)[3-p];const o=[...new Set([d,...String(n).split('').map(Number),(d+3)%10,(d+7)%10])].slice(0,4);return{q:`ما الرقم في منزلة ${names[p]} في العدد ${big(ar(n))}؟`,a:ar(d),o:shuffle(o).map(ar)}},
 value:()=>{const n=R(1000,9999),p=R(1,3);let d=+String(n)[3-p];if(!d)d=1;const m=String(n).split('');m[3-p]=String(d);const nn=+m.join('');const v=d*10**p;const o=shuffle([...new Set([v,d,d*10**((p%3)+1),d*10**(p===1?2:1)])]);return{q:`ما قيمة الرقم ${ar(d)} في العدد ${big(ar(nn))}؟`,a:ar(v),o:o.map(ar)}},
 compare:()=>{let a=R(1000,9999),b=R(1000,9999);if(a===b)b++;return{q:`اختر الإشارة المناسبة: ${big(ar(a)+' ○ '+ar(b))}`,a:a>b?'>':'<',o:['>','<','=']}},
 order:()=>{const xs=[...new Set([R(100,999),R(100,999),R(100,999),R(100,999)])];const t=R(0,1);const s=xs.slice().sort((x,y)=>x-y);return{q:`ما ${t?'أكبر':'أصغر'} عدد بين: ${big(xs.map(ar).join('، '))}؟`,a:ar(t?s[s.length-1]:s[0]),o:shuffle(xs).map(ar)}},
 round10:()=>{const n=R(11,989);return numQ(`قرّب العدد ${big(ar(n))} إلى أقرب عشرة`,Math.round(n/10)*10,20)},
 round100:()=>{const n=R(110,9890);return numQ(`قرّب العدد ${big(ar(n))} إلى أقرب مئة`,Math.round(n/100)*100,200)},
 add2:()=>{const a=R(10,89),b=R(10,89);return numQ(big(ar(a)+' + '+ar(b)+' = ؟'),a+b,12)},
 add3:()=>{const a=R(100,899),b=R(100,899);return numQ(big(ar(a)+' + '+ar(b)+' = ؟'),a+b,30)},
 addEst:()=>{const a=R(110,480),b=R(110,480);return numQ(`قدّر ناتج ${big(ar(a)+' + '+ar(b))} بالتقريب إلى أقرب مئة`,Math.round(a/100)*100+Math.round(b/100)*100,200)},
 addProp:()=>{const a=R(2,40),b=R(2,40);return R(0,1)?numQ(big(ar(a)+' + '+ar(b)+' = '+ar(b)+' + ؟'),a,6):numQ(big(ar(a)+' + ٠ = ؟'),a,5)},
 sub2:()=>{const a=R(30,99),b=R(10,a-5);return numQ(big(ar(a)+' − '+ar(b)+' = ؟'),a-b,10)},

const readKey=(s,t,ui,li)=>{const U=C[s][t][ui],L=U.ls[li];return s==='math'?U.u:(L[0]==='تدريبات الوحدة'?U.u:L[0])};
function toolRead(){
  const s=sel.subj,k=readKey(s,sel.term,sel.ui,sel.li),R0=READ[k],p=$('#panel');
  if(!R0){p.innerHTML='<p class="muted" style="margin:0">لا يوجد نص قرائي لهذا الدرس بعد.</p>';return}
  const skill=s==='math'?'قراءة المسائل الرياضية':LS.read;
  const qs=R0.q.map(x=>({q:x[0],a:x[1],o:shuffle(x[2]),skill}));const done=[];
  p.innerHTML=`<div class="stack" style="gap:14px"><article class="passage"><div class="eyebrow">اقرأ النص بتمعّن</div><h3>${R0.t}</h3><p>${R0.p}</p></article>
  <div class="bank">${qs.map((q,i)=>`<div class="bq" data-i="${i}"><div class="qn">${ar(i+1)}. ${q.q}</div><div class="o">${q.o.map(o=>`<button>${esc(o)}</button>`).join('')}</div></div>`).join('')}</div>
  <div class="sticky-bank"><span id="rs">أجبت عن ${ar(0)} من ${ar(qs.length)}</span><span class="saved">يُحفظ تلقائيًا</span></div></div>`;
  p.querySelectorAll('.bq').forEach(el=>{const q=qs[+el.dataset.i];el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const ok=b.textContent===q.a;done.push(ok);saveAnswer('read',q,ok);
    el.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');
    const r=done.filter(Boolean).length;$('#rs').textContent=done.length<qs.length?`أجبت عن ${ar(done.length)} من ${ar(qs.length)} · صحيح ${ar(r)}`:`انتهيت: ${ar(r)} من ${ar(qs.length)} إجابات صحيحة`;
    if(done.length===qs.length&&!$('#ragain')){const a=document.createElement('button');a.className='btn';a.id='ragain';a.textContent='أعد المحاولة';a.onclick=toolRead;$('#rs').parentNode.appendChild(a)}})});
}

let DB=null,dbState='loading';
const LOCAL_A='cp_attempts',LOCAL_S='cp_surveys';
(async()=>{await 0;try{
  const cfgOk=FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith('ضع');
  if(cfgOk&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);DB=firebase.firestore();try{await DB.enablePersistence({synchronizeTabs:true})}catch(e){}}
  }catch(e){DB=null}dbState=DB?'ready':'local';if(DB)await syncLocal();drawNet();startMine();if(view==='dash')renderDash();if(view==='home'){if(sel.ui==null)renderHome();else drawJourney()}})();

async function syncLocal(){
  for(const [k,col] of [[LOCAL_A,'attempts'],[LOCAL_S,'surveys']]){
    const rows=store.get(k)||[];if(!rows.length)continue;const left=[];
    for(const r of rows){try{await DB.collection(col).add(r)}catch(e){left.push(r)}}
    if(left.length)store.set(k,left);else store.del(k);
  }
}
function netHTML(){return dbState==='ready'?'<span class="net on">متصل بقاعدة البيانات السحابية</span>':dbState==='loading'?'<span class="net">جارٍ الاتصال بالسحابة…</span>':(FIREBASE_CONFIG.apiKey.startsWith('ضع')?'<span class="net off">لم تُربط قاعدة Firebase بعد: الإجابات تُحفظ على هذا الجهاز فقط</span>':'<span class="net off">غير متصل: الإجابات تُحفظ على هذا الجهاز وتُرفع للسحابة عند الاتصال</span>')}
function drawNet(){document.querySelectorAll('.netslot').forEach(e=>e.innerHTML=netHTML())}
function saveRec(col,rec){
  rec.ts=Date.now();
  if(DB){DB.collection(col).add(rec).catch(()=>{const a=store.get(col===('attempts')?LOCAL_A:LOCAL_S)||[];a.push(rec);store.set(col==='attempts'?LOCAL_A:LOCAL_S,a)})}
  else{const k=col==='attempts'?LOCAL_A:LOCAL_S;const a=store.get(k)||[];a.push(rec);store.set(k,a)}
}
function saveAnswer(mode,q,ok){

    q:String(q.q).replace(/<[^>]+>/g,'').slice(0,240),a:q.a,right:ok?1:0,total:1,skills:{[q.skill]:[ok?1:0,1]}};

function startMine(){

}
function lessonStats(s,t,ui,li){const rows=MY.filter(x=>x.subj===s&&x.term===t&&x.ui===ui&&x.li===li);const r=rows.reduce((a,x)=>a+(x.right||0),0),n=rows.reduce((a,x)=>a+(x.total||0),0);return{n,r,p:n?Math.round(r/n*100):0}}
function drawLessonStat(){const el=$('#lstat');if(!el||sel.ui==null)return;const st=lessonStats(sel.subj,sel.term,sel.ui,sel.li);
  el.textContent=st.n?`حللت ${ar(st.n)} سؤالًا في هذا الدرس، الصحيح منها ${ar(st.r)} (${ar(st.p)}٪). كل إجابة تُحفظ تلقائيًا.`:'كل إجابة تحلّها تُحفظ تلقائيًا في رحلتك.'}
const modeTool={quiz:'quiz',game:'read',read:'read',bank:'bank'};

  const [dl,tl]=per('lughati'),[dm,tm]=per('math');

  <div class="jgrid"><div class="tile"><b>${ar(n)}</b><span>سؤال حللته</span></div><div class="tile"><b>${n?ar(Math.round(r/n*100))+'٪':'—'}</b><span>نسبة الإجابات الصحيحة</span></div><div class="tile"><b>${ar(dl+dm)}</b><span>درس تدرّبت عليه</span></div></div>
  <div class="bars">${barRow('لغتي',`${ar(dl)} من ${ar(tl)} دروس`,Math.round(dl/tl*100))}${barRow('الرياضيات',`${ar(dm)} من ${ar(tm)} دروس`,Math.round(dm/tm*100))}</div>
  ${last&&last.ui!=null&&C[last.subj]?.[last.term]?.[last.ui]?.ls[last.li]?`<div class="row" style="justify-content:space-between;align-items:center"><span class="muted">آخر درس: <b style="color:var(--ink)">${esc(last.lesson==='تدريبات الوحدة'?'وحدة '+last.unit:last.lesson)}</b> · ${C[last.subj].name}</span><button class="btn" id="cont">أكمل من حيث توقفت</button></div>`:`<p class="muted" style="margin:0">ابدأ رحلتك باختيار المادة والدرس بالأسفل، وكل سؤال تحلّه سيُحفظ هنا.</p>`}`;
  const c=$('#cont');if(c)c.onclick=()=>{sel={subj:last.subj,term:last.term,ui:last.ui,li:last.li,tool:modeTool[last.mode]||'quiz'};renderHome();const a=$('#lessonArea');if(a)a.scrollIntoView({behavior:'smooth'})};

    <div class="sq"><b>${ar(6)}. هل تشعر أنك أصبحت مستعدًا أكثر للاختبار المركزي؟</b><div class="scale scale3" id="rd">${['نعم','إلى حدٍّ ما','لا'].map(t=>`<button data-v="${t}" aria-pressed="false"><span style="font-size:15px">${t}</span></button>`).join('')}</div></div>
    <div class="sq" style="border:0"><label for="sg"><b>${ar(7)}. اقتراحاتك لتطوير المنصة</b></label><textarea id="sg" rows="4" placeholder="اكتب ما تحب أن نضيفه أو نغيّره…"></textarea></div>
    <div class="err" id="er" aria-live="polite"></div><button class="btn wide" id="send">أرسل رأيي</button></section>`);
  wireNav();
  root.querySelectorAll('.scale[data-q]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{ans[g.dataset.q]=+b.dataset.v;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
  $('#rd').querySelectorAll('button').forEach(b=>b.onclick=()=>{ready=b.dataset.v;$('#rd').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#send').onclick=()=>{if(Object.keys(ans).length<SQ.length||!ready){$('#er').textContent='أجب عن جميع الأسئلة من ١ إلى ٦ قبل الإرسال.';return}
    saveRec('surveys',{name:me.name,cls:me.cls,ratings:SQ.map((_,i)=>ans[i]),ready,suggestion:$('#sg').value.trim().slice(0,600)});
    $('#sv').innerHTML=`<div class="empty"><div class="num" style="font-family:var(--display);font-size:48px;color:var(--good)">شكرًا لك!</div><p style="margin:0">وصل رأيك إلى المعلمة والإدارة.</p><button class="btn" data-go="home">العودة للتدريب</button></div>`;wireNav()};
}

/* ================= teacher ================= */
function renderTLogin(){
  shell(`${topbar()}<div style="padding-top:24px"><h1 style="font-size:clamp(28px,6.5vw,42px);font-weight:800">لوحة المعلمة والإدارة</h1><p style="margin:0;color:var(--muted)">تحليل نتائج الطلاب ومهاراتهم وقياس الأثر.</p></div>`,
  `<div class="card login stack" style="gap:14px"><div class="field"><label for="pw">الرقم السري</label><input type="password" id="pw" inputmode="numeric" autocomplete="off"></div>
  <div class="err" id="er" aria-live="polite"></div><button class="btn wide" id="ok">دخول</button></div>`);
  wireNav();
  const tryIn=()=>{const v=$('#pw').value.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    if(v==='0505'){teacher=true;try{sessionStorage.setItem('cp_t','1')}catch(e){}go('dash')}else $('#er').textContent='الرقم السري غير صحيح.'};
  $('#ok').onclick=tryIn;$('#pw').onkeydown=e=>{if(e.key==='Enter')tryIn()};
}

let unsub=null,AT=[],SV=[],demo=false;
let D={term:'1',subj:'all',cls:'all'};
function startData(){
  if(unsub||!DB)return;unsub=[];
  unsub.push(DB.collection('attempts').onSnapshot(s=>{AT=s.docs.map(d=>Object.assign({_id:d.id},d.data()));if(view==='dash')drawDash()},()=>{}));
  unsub.push(DB.collection('surveys').onSnapshot(s=>{SV=s.docs.map(d=>d.data());if(view==='dash')drawDash()},()=>{}));
}
let deleting=false;
function askDelete(k,n){
  const box=$('#delbox');if(!box)return;box.hidden=false;
  box.innerHTML=`<div class="confirm"><b>حذف إجابات ${esc(n)}؟</b><p style="margin:0" class="muted">لا يمكن التراجع عن الحذف. ستُمسح الإجابات من رحلة الطالب ومن التحليلات.</p>
  <div class="row" style="justify-content:flex-start"><button class="btn danger" id="dTerm">حذف إجابات ${termName(D.term)} فقط</button><button class="btn danger" id="dAll">حذف كل إجاباته</button><button class="btn alt" id="dNo">إلغاء</button></div><div class="err" id="dMsg" aria-live="polite"></div></div>`;
  box.scrollIntoView({block:'nearest'});
  $('#dNo').onclick=()=>{box.hidden=true;box.innerHTML=''};
  $('#dTerm').onclick=()=>doDelete(k,x=>x.term===D.term);
  $('#dAll').onclick=()=>doDelete(k,()=>true);
}
async function doDelete(k,f){
  if(deleting)return;deleting=true;const msg=$('#dMsg');
  const match=x=>(x.key||(x.name+'|'+x.cls))===k&&f(x);
  try{
    if(demo){window.__demo.at=window.__demo.at.filter(x=>!match(x))}
    else if(DB){const ids=AT.filter(match).map(x=>x._id).filter(Boolean);let i=0;
      for(const id of ids){await DB.collection('attempts').doc(id).delete();i++;if(msg)msg.textContent=`جارٍ الحذف… ${ar(i)} من ${ar(ids.length)}`}}
    else{store.set(LOCAL_A,(store.get(LOCAL_A)||[]).filter(x=>!match(x)))}
    deleting=false;drawDash();
  }catch(e){deleting=false;if(msg)msg.textContent='تعذّر الحذف. تأكدي من اتصال الإنترنت ومن قواعد Firebase ثم حاولي مرة أخرى.'}
}
function demoData(){
  const names=['أحمد','سعد','فهد','نواف','يوسف','سارة','ريم','نورة','لمى','جود','هيا','دانة'];const at=[],sv=[];
  CLASSES.forEach(([c,g],ci)=>{for(let k=0;k<5;k++){const n=names[(g==='b'?0:5)+R(0,g==='b'?4:6)]+' '+['العتيبي','القحطاني','الشهري','الحربي','الزهراني'][k];
    ['lughati','math'].forEach(s=>['1','2'].forEach(t=>C[s][t].forEach((u,ui)=>u.ls.forEach((l,li)=>{if(Math.random()<.5)return;const sk={};
      (s==='math'?[l[0]]:l[1].map(f=>LS[f.skillKey])).forEach(x=>{const tot=5,base=.55+ci*.05+(x.length%5)*.05;let r=0;for(let i=0;i<tot;i++)if(Math.random()<Math.min(base,.97))r++;sk[x]=[r,tot]});
      const right=Object.values(sk).reduce((a,v)=>a+v[0],0),total=Object.values(sk).reduce((a,v)=>a+v[1],0);
      at.push({name:n,cls:c,subj:s,term:t,unit:u.u,lesson:l[0],mode:['quiz','read','bank'][R(0,2)],right,total,skills:sk})}))));
    if(Math.random()<.7)sv.push({name:n,cls:c,ratings:SQ.map(()=>R(3,5)),ready:['نعم','نعم','إلى حدٍّ ما'][R(0,2)],suggestion:['','أتمنى إضافة دروس العلوم','اللعبة ممتعة جدًا','أريد أسئلة أكثر في القسمة',''][R(0,4)]})}});
  return{at,sv};
}
function renderDash(){
  if(!teacher){go('tlogin');return}
  shell(`${topbar()}<div style="padding-top:24px;display:grid;gap:6px"><div class="who">لوحة المعلمة والإدارة</div>
    <h1 style="font-size:clamp(28px,6.5vw,42px);font-weight:800">تحليل تقدّم الطلاب</h1></div>`,
  `<div class="filters">
    <div class="seg" role="group" aria-label="الفصل الدراسي">${['1','2'].map(t=>`<button data-dt="${t}" aria-pressed="${D.term===t}">${termName(t)}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="المادة">${[['all','المادتان'],['lughati','لغتي'],['math','الرياضيات']].map(([k,n])=>`<button data-ds="${k}" aria-pressed="${D.subj===k}">${n}</button>`).join('')}</div>
    <select id="dc" aria-label="الفصل"><option value="all">كل الفصول</option>${CLASSES.map(([c])=>`<option ${D.cls===c?'selected':''}>${c}</option>`).join('')}</select>
  </div><div id="dbody" class="stack"></div>`);
  wireNav();
  root.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{D.term=b.dataset.dt;renderDash()});
  root.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{D.subj=b.dataset.ds;renderDash()});
  $('#dc').onchange=e=>{D.cls=e.target.value;drawDash()};
  if(DB)startData();
  drawDash();
}
function agg(rows){let r=0,t=0;rows.forEach(x=>{r+=x.right||0;t+=x.total||0});return t?Math.round(r/t*100):null}
function skillAgg(rows){const m={};rows.forEach(x=>Object.entries(x.skills||{}).forEach(([k,v])=>{m[k]=m[k]||[0,0];m[k][0]+=v[0];m[k][1]+=v[1]}));return Object.entries(m).filter(([,v])=>v[1]).map(([k,v])=>[k,Math.round(v[0]/v[1]*100),v[1]])}
function barRow(label,sub,p){return `<div class="brow"><div class="lbl">${label}${sub?`<small>${sub}</small>`:''}</div><div class="track"><span class="mark" style="right:80%"></span><span class="mark" style="right:60%"></span><i class="lv-${p==null?'mid':lvl(p)}" style="width:${p||0}%;margin-inline-start:0"></i></div><div class="v">${p==null?'—':ar(p)+'٪'}</div></div>`}
function drawDash(){
  const body=$('#dbody');if(!body)return;
  let at,sv,src;
  if(demo){const d=window.__demo||(window.__demo=demoData());at=d.at;sv=d.sv;src='demo'}
  else if(dbState==='loading'){body.innerHTML=`<div class="card empty"><b>جارٍ تحميل البيانات…</b></div>`;return}
  else if(DB){at=AT;sv=SV;src='db'}
  else{at=store.get(LOCAL_A)||[];sv=store.get(LOCAL_S)||[];src='local'}
  const T=at.filter(x=>x.term===D.term&&(D.subj==='all'||x.subj===D.subj));
  const TC=D.cls==='all'?T:T.filter(x=>x.cls===D.cls);
  const students=new Set(TC.map(x=>x.key||(x.name+'|'+x.cls)));const qsum=rows=>rows.reduce((a,x)=>a+(x.total||0),0);
  const svc=D.cls==='all'?sv:sv.filter(x=>x.cls===D.cls);
  const sat=svc.length?Math.round(svc.reduce((a,x)=>a+x.ratings[4],0)/svc.length/5*100):null;
  let html='';
  if(src==='local')html+=`<div class="notice">تظهر هنا النتائج المحفوظة على هذا الجهاز فقط. لكي تصل نتائج جميع الطلاب، اربطي المنصة بقاعدة Firebase كما في خطوات التشغيل.</div>`;
  if(src==='demo')html+=`<div class="notice">هذه بيانات تجريبية للمعاينة فقط وليست نتائج حقيقية. <button class="btn alt" id="nodemo" style="padding:4px 12px;margin-inline-start:6px">إخفاء</button></div>`;
  if(!T.length&&!demo){html+=`<div class="card empty"><h3 style="font-size:22px">لا توجد نتائج بعد لـ${termName(D.term)}</h3><p class="muted" style="margin:0">ستظهر التحليلات هنا عندما يبدأ الطلاب حلّ الأسئلة واللعبة وبنك الأسئلة.</p><button class="btn" id="demo">معاينة ببيانات تجريبية</button></div>`;
    body.innerHTML=html;$('#demo').onclick=()=>{demo=true;drawDash()};return}
  // tiles
  html+=`<div class="tiles"><div class="tile"><b>${ar(students.size)}</b><span>طالب وطالبة</span></div><div class="tile"><b>${ar(qsum(TC))}</b><span>سؤال محلول</span></div>
  <div class="tile"><b style="color:var(--${agg(TC)==null?'muted':lvl(agg(TC))==='good'?'good':lvl(agg(TC))==='mid'?'warn':'bad'})">${agg(TC)==null?'—':ar(agg(TC))+'٪'}</b><span>متوسط الإتقان</span></div>
  <div class="tile"><b>${sat==null?'—':ar(sat)+'٪'}</b><span>الرضا عن المنصة</span></div></div>`;
  // classes progress
  html+=`<section class="card stack" style="gap:14px"><div><div class="eyebrow">${termName(D.term)}</div><h2 style="font-size:22px">تقدّم الفصول جميعها</h2></div>
  <div class="legend"><span><i class="lv-good"></i>٨٠٪ فأكثر قوة</span><span><i class="lv-mid"></i>٦٠–٧٩٪ متوسط</span><span><i class="lv-bad"></i>أقل من ٦٠٪ ضعف</span></div><div class="bars">`;
  CLASSES.forEach(([c])=>{const rows=T.filter(x=>x.cls===c);const n=new Set(rows.map(x=>x.key||x.name)).size;
    if(D.subj==='all'){html+=barRow(c,`${ar(n)} طالب · لغتي ${agg(rows.filter(x=>x.subj==='lughati'))==null?'—':ar(agg(rows.filter(x=>x.subj==='lughati')))+'٪'} · رياضيات ${agg(rows.filter(x=>x.subj==='math'))==null?'—':ar(agg(rows.filter(x=>x.subj==='math')))+'٪'}`,agg(rows))}
    else html+=barRow(c,`${ar(n)} طالب · ${ar(qsum(rows))} سؤال`,agg(rows))});
  html+=`</div></section>`;
  // skills
  const subjects=D.subj==='all'?['lughati','math']:[D.subj];
  subjects.forEach(s=>{
    const rows=TC.filter(x=>x.subj===s);const sk=skillAgg(rows);const order=skillsOf(s,D.term);
    const sorted=sk.slice().sort((a,b)=>b[1]-a[1]);
    html+=`<section class="card stack" style="gap:14px"><div><div class="eyebrow">${D.cls==='all'?'جميع الفصول':D.cls} · ${termName(D.term)}</div><h2 style="font-size:22px">مهارات ${C[s].name}: القوة والضعف</h2></div>`;
    if(!sk.length){html+=`<p class="muted" style="margin:0">لا توجد محاولات في هذه المادة بعد.</p></section>`;return}
    const strong=sorted.filter(x=>x[1]>=80).slice(0,4),weak=sorted.slice().reverse().filter(x=>x[1]<70).slice(0,4);
    html+=`<div class="sw"><div><h3 style="font-size:17px;color:var(--good);margin-bottom:8px">نقاط القوة</h3><ul>${strong.length?strong.map(x=>`<li>${x[0]}<b>${ar(x[1])}٪</b></li>`).join(''):'<li class="muted">لا توجد مهارة وصلت ٨٠٪ بعد</li>'}</ul></div>
    <div><h3 style="font-size:17px;color:var(--bad);margin-bottom:8px">تحتاج إلى علاج</h3><ul>${weak.length?weak.map(x=>`<li>${x[0]}<b>${ar(x[1])}٪</b></li>`).join(''):'<li class="muted">لا توجد مهارة أقل من ٧٠٪</li>'}</ul></div></div>
    <div class="bars">${order.map(k=>{const f=sk.find(x=>x[0]===k);return barRow(k,f?`${ar(f[2])} إجابة`:'لم يُتدرَّب عليها',f?f[1]:null)}).join('')}</div></section>`;
  });
  // students (all classes or one class) with delete
  {const by={};TC.forEach(x=>{const k=x.key||(x.name+'|'+x.cls);(by[k]=by[k]||[]).push(x)});const tq=rows=>rows.reduce((a,x)=>a+(x.total||0),0);
    const list=Object.entries(by).map(([k,rows])=>{const sk=skillAgg(rows).sort((a,b)=>a[1]-b[1]);return{k,n:rows[0].name,c:rows[0].cls,att:tq(rows),p:agg(rows),weak:sk[0]}}).sort((a,b)=>b.p-a.p);
    const all=D.cls==='all';
    html+=`<section class="card stack" style="gap:12px"><div><div class="eyebrow">${all?'جميع الفصول':'تحليل الفصل'} · ${termName(D.term)}</div><h2 style="font-size:22px">${all?'الطلاب':'طلاب '+D.cls}</h2></div>
    <div id="delbox" hidden></div>
    <div class="tbl"><table><thead><tr><th>الطالب</th>${all?'<th>الفصل</th>':''}<th>الأسئلة</th><th>الإتقان</th><th>المستوى</th><th>أضعف مهارة</th><th></th></tr></thead><tbody>
    ${list.map(s=>`<tr><td>${esc(s.n)}</td>${all?`<td>${esc(s.c)}</td>`:''}<td class="num">${ar(s.att)}</td><td class="num">${ar(s.p)}٪</td><td><span class="pill p-${lvl(s.p)}">${lvlName(s.p)}</span></td><td>${s.weak?esc(s.weak[0])+' ('+ar(s.weak[1])+'٪)':'—'}</td><td><button class="delbtn" data-k="${esc(s.k)}" data-n="${esc(s.n)}">حذف الإجابات</button></td></tr>`).join('')}
    </tbody></table></div></section>`;}
  // survey
  html+=`<section class="card stack" style="gap:14px"><div><div class="eyebrow">${D.cls==='all'?'جميع الفصول':D.cls} · ${ar(svc.length)} استجابة</div><h2 style="font-size:22px">قياس الأثر</h2></div>`;
  if(!svc.length)html+=`<p class="muted" style="margin:0">لم يُرسل أي استبيان بعد.</p>`;
  else{html+=`<div class="bars">${SQ.map((q,i)=>barRow(q,'',Math.round(svc.reduce((a,x)=>a+x.ratings[i],0)/svc.length/5*100))).join('')}</div>`;
    const rc={};svc.forEach(x=>rc[x.ready]=(rc[x.ready]||0)+1);
    html+=`<div class="sw" style="grid-template-columns:repeat(3,1fr)">${['نعم','إلى حدٍّ ما','لا'].map(k=>`<div class="tile"><b>${ar(Math.round((rc[k]||0)/svc.length*100))}٪</b><span>مستعد: ${k}</span></div>`).join('')}</div>`;
    const sg=svc.filter(x=>x.suggestion).slice(-12).reverse();
    html+=`<h3 style="font-size:17px">الاقتراحات</h3><div class="sugg">${sg.length?sg.map(x=>`<div>${esc(x.suggestion)}<br><small>${esc(x.name)} · ${esc(x.cls)}</small></div>`).join(''):'<p class="muted" style="margin:0">لا توجد اقتراحات مكتوبة.</p>'}</div>`}
  html+=`</section>`;
  body.innerHTML=html;
  const nd=$('#nodemo');if(nd)nd.onclick=()=>{demo=false;drawDash()};
  body.querySelectorAll('.delbtn').forEach(b=>b.onclick=()=>askDelete(b.dataset.k,b.dataset.n));
}

render();
</script>
</body>
</html>
